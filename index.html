<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudia &amp; Oséias – Convite</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #e7ddc9 url('padrao.png') repeat;
      background-size: 480px auto;
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Capa clicável ── */
    .cover {
      position: relative;
      display: block;
      width: 100%;
      max-width: 460px;
      text-decoration: none;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(40,40,60,.35);
      -webkit-tap-highlight-color: transparent;
    }

    .cover .capa {
      width: 100%;
      display: block;
    }

    /* ── Selo clicável (sobre o selo já existente na capa) ── */
    .cta-seal {
      position: absolute;
      left: 50%;
      top: 74.3%;
      transform: translate(-50%, -50%);
      width: 31%;
      max-width: 158px;
      animation: pulse 1.7s ease-in-out infinite;
    }

    .cta-seal img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 5px 12px rgba(90,60,0,.4));
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.07); }
    }

    .cover:active .cta-seal { animation: none; transform: translate(-50%, -50%) scale(.95); }
  </style>
</head>
<body>

  <a class="cover" href="jantar.html" aria-label="Abrir convite do jantar">
    <img class="capa" src="capa.png" alt="Claudia & Oséias — Você recebeu um convite especial" loading="eager" decoding="async">
    <span class="cta-seal">
      <img src="selo.png" alt="Abrir convite">
    </span>
  </a>

</body>
</html>
