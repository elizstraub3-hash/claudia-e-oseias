<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Claudia &amp; Oséias – Convite</title>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://claudia-e-oseias.vercel.app/">
  <meta property="og:title" content="Claudia &amp; Oséias — Convite Especial">
  <meta property="og:description" content="Você recebeu um convite especial. Toque para abrir 💛">
  <meta property="og:image" content="https://claudia-e-oseias.vercel.app/og.jpg">
  <meta property="og:image:secure_url" content="https://claudia-e-oseias.vercel.app/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Claudia & Oséias">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Claudia &amp; Oséias — Convite Especial">
  <meta name="twitter:description" content="Você recebeu um convite especial. Toque para abrir 💛">
  <meta name="twitter:image" content="https://claudia-e-oseias.vercel.app/og.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Parisienne&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { color-scheme: only light; }
    html, body { height: 100%; }

    body {
      background: #e7ddc9 url('padrao.jpg') repeat;
      background-size: 480px auto;
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Capa clicável ── */
    .cover {
      position: relative;
      display: block;
      width: 100%;
      max-width: 460px;
      text-decoration: none;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(40,40,60,.35);
      -webkit-tap-highlight-color: transparent;
    }

    .cover .capa {
      width: 100%;
      display: block;
    }

    /* ── Selo clicável (sobre o selo já existente na capa) ── */
    .cta-seal {
      position: absolute;
      left: 50%;
      top: 75.9%;
      transform: translate(-50%, -50%);
      width: 24%;
      max-width: 122px;
      animation: pulse 1.7s ease-in-out infinite;
    }

    .cta-seal img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 5px 12px rgba(90,60,0,.4));
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.07); }
    }

    .cover:active .cta-seal { animation: none; transform: translate(-50%, -50%) scale(.95); }

    /* ── Chamada abaixo do selo ── */
    .cta-hint {
      position: absolute;
      left: 50%;
      top: 87%;
      transform: translateX(-50%);
      width: 84%;
      text-align: center;
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(11px, 3.1vw, 15px);
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #2D3E5E;
      text-shadow: 0 1px 4px rgba(253,250,244,.9), 0 0 2px rgba(253,250,244,.9);
      animation: hintFade 1.7s ease-in-out infinite;
    }
    @keyframes hintFade {
      0%, 100% { opacity: .75; }
      50%      { opacity: 1; }
    }

    /* "Tema escuro" que continua claro, para evitar o escurecimento
       automático do modo escuro do navegador. */
    @media (prefers-color-scheme: dark) {
      body { background-color: #e7ddc9 !important; }
      .cta-hint { color: #2D3E5E !important; }
    }
  </style>
</head>
<body>

  <a class="cover" href="jantar.html" aria-label="Abrir convite do jantar">
    <img class="capa" src="capa.jpg" alt="Claudia & Oséias — Você recebeu um convite especial" loading="eager" decoding="async">
    <span class="cta-seal">
      <img src="selo.png" alt="Abrir convite">
    </span>
    <span class="cta-hint">Clique no selo e descubra</span>
  </a>

</body>
</html>
